<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>آفلاین · ردیاب عادت</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tahoma, "Noto Naskh Arabic", "Segoe UI", sans-serif;
        background: #f8f7fc;
        color: #1c1730;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14121c; color: #f6f4fb; }
        p { color: #c9c3d8; }
      }
      main { max-width: 24rem; text-align: center; }
      .mark {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #7c3aed, #d946ef);
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; line-height: 1.8; color: #5c5670; }
      button {
        border: 0;
        border-radius: 0.9rem;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: #6d28d9;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 64 64">
          <path d="M32 12c2 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 6-12 0 4 2 6 4 6 0-6-1-12 2-18z" fill="#fff" />
        </svg>
      </div>
      <h1>اتصال برقرار نیست</h1>
      <p>برای دیدن و ثبت عادت‌ها اینترنت لازم است. وقتی اتصال برگشت، دوباره تلاش کن.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
